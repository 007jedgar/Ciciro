name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck web
        run: npm run typecheck

      - name: Typecheck worker
        run: npm run typecheck:worker

      # Parity tests import apps/mobile sources. Those files sit under a
      # tsconfig that extends expo/tsconfig.base, which only exists after this.
      - name: Install mobile dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Test
        run: npm test

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Typecheck
        run: npm run typecheck:mobile

      - name: Test
        run: npm run test:mobile

  # Job id must stay `test`. The Protect main ruleset requires that check.
  test:
    needs: [web, mobile]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require web and mobile
        run: |
          web="${{ needs.web.result }}"
          mobile="${{ needs.mobile.result }}"
          echo "web=$web mobile=$mobile"
          test "$web" = success
          test "$mobile" = success
