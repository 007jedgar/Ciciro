# A store build on demand, or when a mobile-v* tag is pushed. The build number
# comes from EAS (appVersionSource: remote) and increments on every build. The
# iOS build submits to TestFlight automatically; Android submission is still a
# separate, manual step (no Play Store submit profile yet).
#
#   eas workflow:run .eas/workflows/build-production.yml -F platform=ios
name: Build production

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Which store build to make (a tag push builds iOS)
        options:
          - ios
          - android
          - all
        default: ios

jobs:
  build_ios:
    name: Build iOS
    if: ${{ (inputs.platform || 'ios') != 'android' }}
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  build_android:
    name: Build Android
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    type: build
    params:
      platform: android
      profile: production
