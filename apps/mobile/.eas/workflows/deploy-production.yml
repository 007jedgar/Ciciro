# Every push to main that touches the phone app: publish an over-the-air
# update when the native layer is unchanged, or build a new binary when it
# changed. The fingerprint (runtimeVersion policy in app.json) decides: a
# production build with the same iOS fingerprint means the JavaScript can go
# out as an update to the builds already installed. See docs/mobile-release.md.
#
# iOS only until Android launches; add the matching android jobs then.
name: Deploy to production

on:
  push:
    branches: ['main']
    paths: ['apps/mobile/**']

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production

  get_ios_build:
    name: Find a production iOS build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  publish_ios_update:
    name: Publish iOS update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    env:
      CICIRO_RELEASE: '1'
    params:
      channel: production
      platform: ios

  build_ios:
    name: Build iOS (native code changed)
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production
